name: lifesync_app
description: "LifeSync - Smart Reminder & Adaptive Financial Goal Tracker"
publish_to: 'none'

version: 2026.10.15+2026101502

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.5
  
  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.2
  
  # Utils
  intl: any
  uuid: ^4.3.3
  shared_preferences: ^2.2.0
  
  # UI
  fl_chart: ^0.66.0
  table_calendar: ^3.1.0
  google_fonts: ^6.1.0
  googleapis: ^13.0.0
  googleapis_auth: ^1.6.0
  home_widget: 0.9.3
  workmanager: ^0.9.0+3
  package_info_plus: 9.0.1
  audioplayers: ^6.7.1
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.2.1
  file_picker: ^8.1.4
  video_player: ^2.13.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  isar_generator: ^3.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logoandroid.png"
  min_sdk_android: 21
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/
